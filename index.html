<!doctype html>
<html lang="ar" dir="rtl">
<head>

<title>اختبار الحفظ · حلقة القرآن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;500;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: a roster of students grouped by branch; tapping a question opens a full-screen Madinah-style mushaf page with the prompt above it and the answer key below. */
:root{
  --paper:#f6f1e4;        /* mushaf paper */
  --bg:#ebe4d2;           /* desk around the page */
  --fg:#2a2418;
  --muted:#6f6554;
  --frame:#1f5a3c;        /* Madinah green frame */
  --frame-2:#c9a44a;      /* gilt rule */
  --card:#fbf8ef;
  --line:#d9cfb6;
  --hl:#fff1a8;           /* highlighted ayah */
  --hl-2:#f1cf5a;
  --mark:#8b2e2e;         /* verse-number ink */
  --done:#2e7d4f;
  --font-quran:"Amiri Quran","Noto Naskh Arabic",serif;
  --font-ui:"Noto Naskh Arabic",system-ui,serif;
  --font-head:"Noto Kufi Arabic","Noto Naskh Arabic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#f3edde; --bg:#17191c; --fg:#e8e3d6; --muted:#a39b8a; --frame:#2f7a53; --frame-2:#d4b35e;
  --card:#23262b; --line:#3a3e45; --hl:#fff1a8; --hl-2:#f1cf5a; --mark:#8b2e2e; --done:#5fbf8a; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#f3edde; --bg:#17191c; --fg:#e8e3d6; --muted:#a39b8a; --frame:#2f7a53; --frame-2:#d4b35e;
  --card:#23262b; --line:#3a3e45; --hl:#fff1a8; --hl-2:#f1cf5a; --mark:#8b2e2e; --done:#5fbf8a; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);direction:rtl;font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--frame)}
.wrap{max-width:720px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--frame);color:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 18px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--frame-2)}
header.top h1{margin:0;font:700 20px/1.3 var(--font-head)}
header.top p{margin:4px 0 0;font-size:14px;opacity:.9}
.rules{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;color:var(--muted);margin:0 0 20px}
.rules b{color:var(--fg);font-weight:500}
section.branch{margin-bottom:26px}
.branch h2{margin:0 0 10px;font:700 17px/1.3 var(--font-head);display:flex;align-items:center;gap:8px}
.branch h2 small{font:400 13px/1 var(--font-ui);color:var(--muted);margin-inline-start:auto}
.student{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.student .name{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.student .name b{font-size:18px;font-weight:700}
.student .name span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qs{display:flex;flex-wrap:wrap;gap:8px}
.q{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);font:500 15px/1 var(--font-ui);padding:10px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.q:focus-visible{outline:2px solid var(--frame-2);outline-offset:2px}
.q .tag{font-size:12px;color:#fff;background:var(--frame);border-radius:999px;padding:3px 8px}
.q.m .tag{background:var(--mark)}
.q.done{border-color:var(--done);color:var(--done)}
.q.done::after{content:"✓";font-weight:700}

/* Viewer */
.viewer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.viewer .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.viewer .bar .who{font:700 17px/1.3 var(--font-head)}
.viewer .bar .who small{display:block;font:400 13px/1.3 var(--font-ui);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);font:500 15px/1 var(--font-ui);padding:10px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--frame);color:#fff;border-color:var(--frame)}
.btn:focus-visible{outline:2px solid var(--frame-2);outline-offset:2px}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.prompt .kind{font-size:12px;color:#fff;background:var(--frame);display:inline-block;border-radius:999px;padding:3px 10px;margin-bottom:6px}
.prompt.m .kind{background:var(--mark)}
.prompt p{margin:0;font-size:16px}
.prompt .ref{color:var(--muted);font-size:14px;margin-top:4px}

/* Mushaf page: Madinah proportions (~1:1.6), 15 lines */
.page{background:var(--paper);color:#1d1a12;margin:0 auto;width:min(100%,520px);aspect-ratio:10/16;border:6px double var(--frame);outline:2px solid var(--frame-2);outline-offset:-10px;padding:5.5% 6% 4.5%;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.page .head{display:flex;justify-content:space-between;font:500 11px/1 var(--font-ui);color:var(--frame);margin-bottom:1.2%}
.page .lines{flex:1;min-height:0;position:relative;overflow:hidden}
.page .txt{font-family:var(--font-quran);text-align:justify;text-align-last:justify;word-spacing:.05em;direction:rtl}
.page .txt .sh{text-align:center;text-align-last:center;font:700 .62em/1 var(--font-head);color:#fff;background:var(--frame);border:2px solid var(--frame-2);border-radius:6px;display:flex;align-items:center;justify-content:center;margin:0}
.page .txt .bs{text-align:center;text-align-last:center}
.page .txt .v{transition:background .2s}
.page .txt .v.hl{background:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 88%,transparent 88%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.page .txt .n{display:inline-block;color:var(--mark);font-family:var(--font-ui);font-weight:700;font-size:.62em;width:1.55em;height:1.55em;line-height:1.45em;text-align:center;text-align-last:center;border:1.5px solid var(--frame-2);border-radius:50%;vertical-align:middle;margin:0 .15em;box-shadow:inset 0 0 0 1px var(--paper),inset 0 0 0 2px var(--frame)}
.page .foot{text-align:center;font:500 12px/1 var(--font-ui);color:var(--frame);margin-top:1.2%;font-variant-numeric:tabular-nums}

.answer{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.answer h3{margin:0 0 8px;font:700 15px/1.3 var(--font-head);color:var(--mark)}
.answer ol{margin:0;padding:0 18px 0 0;display:grid;gap:10px}
.answer li .ay{font-family:var(--font-quran);font-size:21px;line-height:1.9}
.answer li .loc{font-size:13px;color:var(--muted)}
.answer li .loc .out{color:var(--mark)}
.answer li .note{font-size:14px;margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions .btn{flex:1 1 140px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

كر المواضع التي بدأت بـ«فذكر» في مقررك وما بعد كل منها.", "answers": [{"key": "88-21", "note": "الغاشية: «إنما أنت مذكر»."}, {"key": "87-9", "note": "الأعلى: «إن نفعت الذكرى»."}, {"key": "52-29", "note": "الطور: «فما أنت بنعمة ربك بكاهن ولا مجنون»."}, {"key": "50-45", "note": "ق: «فذكر بالقرآن من يخاف وعيد»."}], "minJuz": 26, "id": "q20"}, {"type": "p", "student": "يزيد المولد", "page": 538, "focus": [], "prompt": "اتلُ الصفحة كاملةً من أولها إلى آخرها.", "id": "q21"}, {"type": "m", "student": "زياد الأحمد", "page": "83-6", "focus": ["83-6"], "prompt": "اتلُ الآية المظلّلة، ثم اذكر الموضع الآخر في مقررك الذي بدأ بـ«يوم يقوم» وما بعده.", "answers": [{"key": "83-6", "note": "المطففين: «الناس لرب العالمين»."}, {"key": "78-38", "note": "النبأ: «الروح والملائكة صفا»."}, {"key": "14-41", "note": "إبراهيم: «يوم يقوم الحساب»."}], "minJuz": 26, "id": "q22"}, {"type": "m", "student": "زياد الأحمد", "page": "84-16", "focus": ["84-16"], "prompt": "اتلُ الآية المظلّلة، ثم اذكر مواضع «لا أقسم / فلا أقسم» في مقررك وبِمَ أُقسم في كل موضع.", "answers": [{"key": "84-16", "note": "الانشقاق: «بالشفق»."}, {"key": "81-15", "note": "التكوير: «بالخنس»."}, {"key": "75-1", "note": "القيامة: «لا أقسم بيوم القيامة» بلا فاء."}, {"key": "70-40", "note": "المعارج: «برب المشارق والمغارب»."}, {"key": "69-38", "note": "الحاقة: «بما تبصرون»."}, {"key": "56-75", "note": "الواقعة: «بمواقع النجوم»."}], "minJuz": 26, "id": "q23"}, {"type": "p", "student": "زياد الأحمد", "page": 542, "focus": [], "prompt": "اتلُ الصفحة كاملةً من أولها إلى آخرها.", "id": "q24"}];
const PAGES={"7": [{"s": 2, "a": 38, "t": "قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا فَإِمَّا يَأْتِيَنَّكُمْ مِنِّي هُدًى فَمَنْ تَبِعَ هُدَايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ"}, {"s": 2, "a": 39, "t": "وَالَّذِينَ كَفَرُوا وَكَذَّبُوا بِآيَاتِنَا أُولَئِكَ أَصْحَابُ النَّارِ هُمْ فِيهَا خَالِدُونَ"}, {"s": 2, "a": 40, "t": "يَابَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا بِعَهْدِي أُوفِ بِعَهْدِكُمْ وَإِيَّايَ فَارْهَبُونِ"}, {"s": 2, "a": 41, "t": "وَآمِنُوا بِمَا أَنْزَلْتُ مُصَدِّقًا لِمَا مَعَكُمْ وَلَا تَكُونُوا أَوَّلَ كَافِرٍ بِهِ وَلَا تَشْتَرُوا بِآيَاتِي ثَمَنًا قَلِيلًا وَإِيَّايَ فَاتَّقُونِ"}, {"s": 2, "a": 42, "t": "وَلَا تَلْبِسُوا الْحَقَّ بِالْبَاطِلِ وَتَكْتُمُوا الْحَقَّ وَأَنْتُمْ تَعْلَمُونَ"}, {"s": 2, "a": 43, "t": "وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ"}, {"s": 2, "a": 44, "t": "أَتَأْمُرُونَ النَّاسَ بِالْبِرِّ وَتَنْسَوْنَ أَنْفُسَكُمْ وَأَنْتُمْ تَتْلُونَ الْكِتَابَ أَفَلَا تَعْقِلُونَ"}, {"s": 2, "a": 45, "t": "وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِينَ"}, {"s": 2, "a": 46, "t": "الَّذِينَ يَظُنُّونَ أَنَّهُمْ مُلَاقُو رَبِّهِمْ وَأَنَّهُمْ إِلَيْهِ رَاجِعُونَ"}, {"s": 2, "a": 47, "t": "يَابَنِي إِسْرَائِيلَ اذْكُرُوا نِعْمَتِيَ الَّتِي أَنْعَمْتُ عَلَيْكُمْ وَأَنِّي فَضَّلْتُكُمْ عَلَى الْعَالَمِينَ"}, {"s": 2, "a": 48, "t": "وَاتَّقُوا يَوْمًا لَا تَجْزِي نَفْسٌ عَنْ نَفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا شَفَاعَةٌ وَلَا يُؤْخَذُ مِنْهَا عَدْلٌ وَلَا هُمْ يُنْصَرُونَ"}], "140": [{"s": 6, "a": 95, "t": "إِنَّ اللَّهَ فَالِقُ الْحَبِّ وَالنَّوَى يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَمُخْرِجُ الْمَيِّتِ مِنَ الْحَيِّ ذَلِكُمُ اللَّهُ فَأَنَّى تُؤْفَكُونَ"}, {"s": 6, "a": 96, "t": "فَالِقُ الْإِصْبَاحِ وَجَعَلَ اللَّيْلَ سَكَنًا وَالشَّمْسَ وَالْقَمَرَ حُسْبَانًا ذَلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ"}, {"s": 6, "a": 97, "t": "وَهُوَ الَّذِي جَعَلَ لَكُمُ النُّجُومَ لِتَهْتَدُوا بِهَا فِي ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ قَدْ فَصَّلْنَا الْآيَاتِ لِقَوْمٍ يَعْلَمُونَ"}, {"s": 6, "a": 98, "t": "وَهُوَ الَّذِي أَنْشَأَكُمْ مِنْ نَفْسٍ وَاحِدَةٍ فَمُسْتَقَرٌّ وَمُسْتَوْدَعٌ قَدْ فَصَّلْنَا الْآيَاتِ لِقَوْمٍ يَفْقَهُونَ"}, {"s": 6, "a": 99, "t": "وَهُوَ الَّذِي أَنْزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجْنَا بِهِ نَبَاتَ كُلِّ شَيْءٍ فَأَخْرَجْنَا مِنْهُ خَضِرًا نُخْرِجُ مِنْهُ حَبًّا مُتَرَاكِبًا وَمِنَ النَّخْلِ مِنْ طَلْعِهَا قِنْوَانٌ دَانِيَةٌ وَجَنَّاتٍ مِنْ أَعْنَابٍ وَالزَّيْتُونَ وَالرُّمَّانَ مُشْتَبِهًا وَغَيْرَ مُتَشَابِهٍ انْظُرُوا إِلَى ثَمَرِهِ إِذَا أَثْمَرَ وَيَنْعِهِ إِنَّ فِي ذَلِكُمْ لَآيَاتٍ لِقَوْمٍ يُؤْمِنُونَ"}, {"s": 6, "a": 100, "t": "وَجَعَلُوا لِلَّهِ شُرَكَاءَ الْجِنَّ وَخَلَقَهُمْ وَخَرَقُوا لَهُ بَنِينَ وَبَنَاتٍ بِغَيْرِ عِلْمٍ سُبْحَانَهُ وَتَعَالَى عَمَّا يَصِفُونَ"}, {"s": 6, "a": 101, "t": "بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ أَنَّى يَكُونُ لَهُ وَلَدٌ وَلَمْ تَكُنْ لَهُ صَاحِبَةٌ وَخَلَقَ كُلَّ شَيْءٍ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ"}], "288": [{"s": 17, "a": 59, "t": "وَمَا مَنَعَنَا أَنْ نُرْسِلَ بِالْآيَاتِ إِلَّا أَنْ كَذَّبَ بِهَا الْأَوَّلُونَ وَآتَيْنَا ثَمُودَ النَّاقَةَ مُبْصِرَةً فَظَلَمُوا بِهَا وَمَا نُرْسِلُ بِالْآيَاتِ إِلَّا تَخْوِيفًا"}, {"s": 17, "a": 60, "t": "وَإِذْ قُلْنَا لَكَ إِنَّ رَبَّكَ أَحَاطَ بِالنَّاسِ وَمَا جَعَلْنَا الرُّؤْيَا الَّتِي أَرَيْنَاكَ إِلَّا فِتْنَةً لِلنَّاسِ وَالشَّجَرَةَ الْمَلْعُونَةَ فِي الْقُرْآنِ وَنُخَوِّفُهُمْ فَمَا يَزِيدُهُمْ إِلَّا طُغْيَانًا كَبِيرًا"}, {"s": 17, "a": 61, "t": "وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ قَالَ أَأَسْجُدُ لِمَنْ خَلَقْتَ طِينًا"}, {"s": 17, "a": 62, "t": "قَالَ أَرَأَيْتَكَ هَذَا الَّذِي كَرَّمْتَ عَلَيَّ لَئِنْ أَخَّرْتَنِ إِلَى يَوْمِ الْقِيَامَةِ لَأَحْتَنِكَنَّ ذُرِّيَّتَهُ إِلَّا قَلِيلًا"}, {"s": 17, "a": 63, "t": "قَالَ اذْهَبْ فَمَنْ تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَاؤُكُمْ جَزَاءً مَوْفُورًا"}, {"s": 17, "a": 64, "t": "وَاسْتَفْزِزْ مَنْ اسْتَطَعْتَ مِنْهُمْ بِصَوْتِكَ وَأَجْلِبْ عَلَيْهِمْ بِخَيْلِكَ وَرَجِلِكَ وَشَارِكْهُمْ فِي الْأَمْوَالِ وَالْأَوْلَادِ وَعِدْهُمْ وَمَا يَعِدُهُمُ الشَّيْطَانُ إِلَّا غُرُورًا"}, {"s": 17, "a": 65, "t": "إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ وَكَفَى بِرَبِّكَ وَكِيلًا"}, {"s": 17, "a": 66, "t": "رَبُّكُمُ الَّذِي يُزْجِي لَكُمُ الْفُلْكَ فِي الْبَحْرِ لِتَبْتَغُوا مِنْ فَضْلِهِ إِنَّهُ كَانَ بِكُمْ رَحِيمًا"}], "462": [{"s": 39, "a": 32, "t": "فَمَنْ أَظْلَمُ مِمَّنْ كَذَبَ عَلَى اللَّهِ وَكَذَّبَ بِالصِّدْقِ إِذْ جَاءَهُ أَلَيْسَ فِي جَهَنَّمَ مَثْوًى لِلْكَافِرِينَ"}, {"s": 39, "a": 33, "t": "وَالَّذِي جَاءَ بِالصِّدْقِ وَصَدَّقَ بِهِ أُولَئِكَ هُمُ الْمُتَّقُونَ"}, {"s": 39, "a": 34, "t": "لَهُمْ مَا يَشَاءُونَ عِنْدَ رَبِّهِمْ ذَلِكَ جَزَاءُ الْمُحْسِنِينَ"}, {"s": 39, "a": 35, "t": "لِيُكَفِّرَ اللَّهُ عَنْهُمْ أَسْوَأَ الَّذِي عَمِلُوا وَيَجْزِيَهُمْ أَجْرَهُمْ بِأَحْسَنِ الَّذِي كَانُوا يَعْمَلُونَ"}, {"s": 39, "a": 36, "t": "أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ وَيُخَوِّفُونَكَ بِالَّذِينَ مِنْ دُونِهِ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ"}, {"s": 39, "a": 37, "t": "وَمَنْ يَهْدِ اللَّهُ فَمَا لَهُ مِنْ مُضِلٍّ أَلَيْسَ اللَّهُ بِعَزِيزٍ ذِي انْتِقَامٍ"}, {"s": 39, "a": 38, "t": "وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ قُلْ أَفَرَأَيْتُمْ مَا تَدْعُونَ مِنْ دُونِ اللَّهِ إِنْ أَرَادَنِيَ اللَّهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّهِ أَوْ أَرَادَنِي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِهِ قُلْ حَسْبِيَ اللَّهُ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ"}, {"s": 39, "a": 39, "t": "قُلْ يَاقَوْمِ اعْمَلُوا عَلَى مَكَانَتِكُمْ إِنِّي عَامِلٌ فَسَوْفَ تَعْلَمُونَ"}, {"s": 39, "a": 40, "t": "مَنْ يَأْتِيهِ عَذَابٌ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٌ مُقِيمٌ"}], "515": [{"s": 48, "a": 29, "t": "مُحَمَّدٌ رَسُولُ اللَّهِ وَالَّذِينَ مَعَهُ أَشِدَّاءُ عَلَى الْكُفَّارِ رُحَمَاءُ بَيْنَهُمْ تَرَاهُمْ رُكَّعًا سُجَّدًا يَبْتَغُونَ فَضْلًا مِنَ اللَّهِ وَرِضْوَانًا سِيمَاهُمْ فِي وُجُوهِهِمْ مِنْ أَثَرِ السُّجُودِ ذَلِكَ مَثَلُهُمْ فِي التَّوْرَاةِ وَمَثَلُهُمْ فِي الْإِنْجِيلِ كَزَرْعٍ أَخْرَجَ شَطْأَهُ فَآزَرَهُ فَاسْتَغْلَظَ فَاسْتَوَى عَلَى سُوقِهِ يُعْجِبُ الزُّرَّاعَ لِيَغِيظَ بِهِمُ الْكُفَّارَ وَعَدَ اللَّهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ مِنْهُمْ مَغْفِرَةً وَأَجْرًا عَظِيمًا"}, {"s": 49, "a": 1, "t": "يَاأَيُّهَا الَّذِينَ آمَنُوا لَا تُقَدِّمُوا بَيْنَ يَدَيِ اللَّهِ وَرَسُولِهِ وَاتَّقُوا اللَّهَ إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ"}, {"s": 49, "a": 2, "t": "يَاأَيُّهَا الَّذِينَ آمَنُوا لَا تَرْفَعُوا أَصْوَاتَكُمْ فَوْقَ صَوْتِ النَّبِيِّ وَلَا تَجْهَرُوا لَهُ بِالْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ أَنْ تَحْبَطَ أَعْمَالُكُمْ وَأَنْتُمْ لَا تَشْعُرُونَ"}, {"s": 49, "a": 3, "t": "إِنَّ الَّذِينَ يَغُضُّونَ أَصْوَاتَهُمْ عِنْدَ رَسُولِ اللَّهِ أُولَئِكَ الَّذِينَ امْتَحَنَ اللَّهُ قُلُوبَهُمْ لِلتَّقْوَى لَهُمْ مَغْفِرَةٌ وَأَجْرٌ عَظِيمٌ"}, {"s": 49, "a": 4, "t": "إِنَّ الَّذِينَ يُنَادُونَكَ مِنْ وَرَاءِ الْحُجُرَاتِ أَكْثَرُهُمْ لَا يَعْقِلُونَ"}], "237": [{"s": 12, "a": 15, "t": "فَلَمَّا ذَهَبُوا بِهِ وَأَجْمَعُوا أَنْ يَجْعَلُوهُ فِي غَيَابَتِ الْجُبِّ وَأَوْحَيْنَا إِلَيْهِ لَتُنَبِّئَنَّهُمْ بِأَمْرِهِمْ هَذَا وَهُمْ لَا يَشْعُرُونَ"}, {"s": 12, "a": 16, "t": "وَجَاءُوا أَبَاهُمْ عِشَاءً يَبْكُونَ"}, {"s": 12, "a": 17, "t": "قَالُوا يَاأَبَانَا إِنَّا ذَهَبْنَا نَسْتَبِقُ وَتَرَكْنَا يُوسُفَ عِنْدَ مَتَاعِنَا فَأَكَلَهُ الذِّئْبُ وَمَا أَنْتَ بِمُؤْمِنٍ لَنَا وَلَوْ كُنَّا صَادِقِينَ"}, {"s": 12, "a": 18, "t": "وَجَاءُوا عَلَى قَمِيصِهِ بِدَمٍ كَذِبٍ قَالَ بَلْ سَوَّلَتْ لَكُمْ أَنْفُسُكُمْ أَمْرًا فَصَبْرٌ جَمِيلٌ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ"}, {"s": 12, "a": 19, "t": "وَجَاءَتْ سَيَّارَةٌ فَأَرْسَلُوا وَارِدَهُمْ فَأَدْلَى دَلْوَهُ قَالَ يَابُشْرَى هَذَا غُلَامٌ وَأَسَرُّوهُ بِضَاعَةً وَاللَّهُ عَلِيمٌ بِمَا يَعْمَلُونَ"}, {"s": 12, "a": 20, "t": "وَشَرَوْهُ بِثَمَنٍ بَخْسٍ دَرَاهِمَ مَعْدُودَةٍ وَكَانُوا فِيهِ مِنَ الزَّاهِدِينَ"}, {"s": 12, "a": 21, "t": "وَقَالَ الَّذِي اشْتَرَاهُ مِنْ مِصْرَ لِامْرَأَتِهِ أَكْرِمِي مَثْوَاهُ عَسَى أَنْ يَنْفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ وَلِنُعَلِّمَهُ مِنْ تَأْوِيلِ الْأَحَادِيثِ وَاللَّهُ غَالِبٌ عَلَى أَمْرِهِ وَلَكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ"}, {"s": 12, "a": 22, "t": "وَلَمَّا بَلَغَ أَشُدَّهُ آتَيْنَاهُ حُكْمًا وَعِلْمًا وَكَذَلِكَ نَجْزِي الْمُحْسِنِينَ"}], "482": [{"s": 41, "a": 47, "t": "إِلَيْهِ يُرَدُّ عِلْمُ السَّاعَةِ وَمَا تَخْرُجُ مِنْ ثَمَرَاتٍ مِنْ أَكْمَامِهَا وَمَا تَحْمِلُ مِنْ أُنْثَى وَلَا تَضَعُ إِلَّا بِعِلْمِهِ وَيَوْمَ يُنَادِيهِمْ أَيْنَ شُرَكَائِي قَالُوا آذَنَّاكَ مَا مِنَّا مِنْ شَهِيدٍ"}, {"s": 41, "a": 48, "t": "وَضَلَّ عَنْهُمْ مَا كَانُوا يَدْعُونَ مِنْ قَبْلُ وَظَنُّوا مَا لَهُمْ مِنْ مَحِيصٍ"}, {"s": 41, "a": 49, "t": "لَا يَسْأَمُ الْإِنْسَانُ مِنْ دُعَاءِ الْخَيْرِ وَإِنْ مَسَّهُ الشَّرُّ فَيَئُوسٌ قَنُوطٌ"}, {"s": 41, "a": 50, "t": "وَلَئِنْ أَذَقْنَاهُ رَحْمَةً مِنَّا مِنْ بَعْدِ ضَرَّاءَ مَسَّتْهُ لَيَقُولَنَّ هَذَا لِي وَمَا أَظُنُّ السَّاعَةَ قَائِمَةً وَلَئِنْ رُجِعْتُ إِلَى رَبِّي إِنَّ لِي عِنْدَهُ لَلْحُسْنَى فَلَنُنَبِّئَنَّ الَّذِينَ كَفَرُوا بِمَا عَمِلُوا وَلَنُذِيقَنَّهُمْ مِنْ عَذَابٍ غَلِيظٍ"}, {"s": 41, "a": 51, "t": "وَإِذَا أَنْعَمْنَا عَلَى الْإِنْسَانِ أَعْرَضَ وَنَأَى بِجَانِبِهِ وَإِذَا مَسَّهُ الشَّرُّ فَذُو دُعَاءٍ عَرِيضٍ"}, {"s": 41, "a": 52, "t": "قُلْ أَرَأَيْتُمْ إِنْ كَانَ مِنْ عِنْدِ اللَّهِ ثُمَّ كَفَرْتُمْ بِهِ مَنْ أَضَلُّ مِمَّنْ هُوَ فِي شِقَاقٍ بَعِيدٍ"}, {"s": 41, "a": 53, "t": "سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنْفُسِهِمْ حَتَّى يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ أَوَلَمْ يَكْفِ بِرَبِّكَ أَنَّهُ عَلَى كُلِّ شَيْءٍ شَهِيدٌ"}, {"s": 41, "a": 54, "t": "أَلَا إِنَّهُمْ فِي مِرْيَةٍ مِنْ لِقَاءِ رَبِّهِمْ أَلَا إِنَّهُ بِكُلِّ شَيْءٍ مُحِيطٌ"}], "272": [{"s": 16, "a": 43, "t": "وَمَا أَرْسَلْنَا مِنْ قَبْلِكَ إِلَّا رِجَالًا نُوحِي إِلَيْهِمْ فَاسْأَلُوا أَهْلَ الذِّكْرِ إِنْ كُنْتُمْ لَا تَعْلَمُونَ"}, {"s": 16, "a": 44, "t": "بِالْبَيِّنَاتِ وَالزُّبُرِ وَأَنْزَلْنَا إِلَيْكَ الذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ وَلَعَلَّهُمْ يَتَفَكَّرُونَ"}, {"s": 16, "a": 45, "t": "أَفَأَمِنَ الَّذِينَ مَكَرُوا السَّيِّئَاتِ أَنْ يَخْسِفَ اللَّهُ بِهِمُ الْأَرْضَ أَوْ يَأْتِيَهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ"}, {"s": 16, "a": 46, "t": "أَوْ يَأْخُذَهُمْ فِي تَقَلُّبِهِمْ فَمَا هُمْ بِمُعْجِزِينَ"}, {"s": 16, "a": 47, "t": "أَوْ يَأْخُذَهُمْ عَلَى تَخَوُّفٍ فَإِنَّ رَبَّكُمْ لَرَءُوفٌ رَحِيمٌ"}, {"s": 16, "a": 48, "t": "أَوَلَمْ يَرَوْا إِلَى مَا خَلَقَ اللَّهُ مِنْ شَيْءٍ يَتَفَيَّأُ ظِلَالُهُ عَنِ الْيَمِينِ وَالشَّمَائِلِ سُجَّدًا لِلَّهِ وَهُمْ دَاخِرُونَ"}, {"s": 16, "a": 49, "t": "وَلِلَّهِ يَسْجُدُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ مِنْ دَابَّةٍ وَالْمَلَائِكَةُ وَهُمْ لَا يَسْتَكْبِرُونَ"}, {"s": 16, "a": 50, "t": "يَخَافُونَ رَبَّهُمْ مِنْ فَوْقِهِمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ"}, {"s": 16, "a": 51, "t": "وَقَالَ اللَّهُ لَا تَتَّخِذُوا إِلَهَيْنِ اثْنَيْنِ إِنَّمَا هُوَ إِلَهٌ وَاحِدٌ فَإِيَّايَ فَارْهَبُونِ"}, {"s": 16, "a": 52, "t": "وَلَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَلَهُ الدِّينُ وَاصِبًا أَفَغَيْرَ اللَّهِ تَتَّقُونَ"}, {"s": 16, "a": 53, "t": "وَمَا بِكُمْ مِنْ نِعْمَةٍ فَمِنَ اللَّهِ ثُمَّ إِذَا مَسَّكُمُ الضُّرُّ فَإِلَيْهِ تَجْأَرُونَ"}, {"s": 16, "a": 54, "t": "ثُمَّ إِذَا كَشَفَ الضُّرَّ عَنْكُمْ إِذَا فَرِيقٌ مِنْكُمْ بِرَبِّهِمْ يُشْرِكُونَ"}], "563": [{"s": 67, "a": 13, "t": "وَأَسِرُّوا قَوْلَكُمْ أَوْ اجْهَرُوا بِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ"}, {"s": 67, "a": 14, "t": "أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ"}, {"s": 67, "a": 15, "t": "هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ وَإِلَيْهِ النُّشُورُ"}, {"s": 67, "a": 16, "t": "أَأَمِنْتُمْ مَنْ فِي السَّمَاءِ أَنْ يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ"}, {"s": 67, "a": 17, "t": "أَمْ أَمِنْتُمْ مَنْ فِي السَّمَاءِ أَنْ يُرْسِلَ عَلَيْكُمْ حَاصِبًا فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ"}, {"s": 67, "a": 18, "t": "وَلَقَدْ كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ"}, {"s": 67, "a": 19, "t": "أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَنُ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ"}, {"s": 67, "a": 20, "t": "أَمَّنْ هَذَا الَّذِي هُوَ جُنْدٌ لَكُمْ يَنْصُرُكُمْ مِنْ دُونِ الرَّحْمَنِ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ"}, {"s": 67, "a": 21, "t": "أَمَّنْ هَذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ بَلْ لَجُّوا فِي عُتُوٍّ وَنُفُورٍ"}, {"s": 67, "a": 22, "t": "أَفَمَنْ يَمْشِي مُكِبًّا عَلَى وَجْهِهِ أَهْدَى أَمَّنْ يَمْشِي سَوِيًّا عَلَى صِرَاطٍ مُسْتَقِيمٍ"}, {"s": 67, "a": 23, "t": "قُلْ هُوَ الَّذِي أَنْشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَا تَشْكُرُونَ"}, {"s": 67, "a": 24, "t": "قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ"}, {"s": 67, "a": 25, "t": "وَيَقُولُونَ مَتَى هَذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ"}, {"s": 67, "a": 26, "t": "قُلْ إِنَّمَا الْعِلْمُ عِنْدَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُبِينٌ"}], "473": [{"s": 40, "a": 50, "t": "قَالُوا أَوَلَمْ تَكُ تَأْتِيكُمْ رُسُلُكُمْ بِالْبَيِّنَاتِ قَالُوا بَلَى قَالُوا فَادْعُوا وَمَا دُعَاءُ الْكَافِرِينَ إِلَّا فِي ضَلَالٍ"}, {"s": 40, "a": 51, "t": "إِنَّا لَنَنْصُرُ رُسُلَنَا وَالَّذِينَ آمَنُوا فِي الْحَيَاةِ الدُّنْيَا وَيَوْمَ يَقُومُ الْأَشْهَادُ"}, {"s": 40, "a": 52, "t": "يَوْمَ لَا يَنْفَعُ الظَّالِمِينَ مَعْذِرَتُهُمْ وَلَهُمُ اللَّعْنَةُ وَلَهُمْ سُوءُ الدَّارِ"}, {"s": 40, "a": 53, "t": "وَلَقَدْ آتَيْنَا مُوسَى الْهُدَى وَأَوْرَثْنَا بَنِي إِسْرَائِيلَ الْكِتَابَ"}, {"s": 40, "a": 54, "t": "هُدًى وَذِكْرَى لِأُولِي الْأَلْبَابِ"}, {"s": 40, "a": 55, "t": "فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ وَاسْتَغْفِرْ لِذَنْبِكَ وَسَبِّحْ بِحَمْدِ رَبِّكَ بِالْعَشِيِّ وَالْإِبْكَارِ"}, {"s": 40, "a": 56, "t": "إِنَّ الَّذِينَ يُجَادِلُونَ فِي آيَاتِ اللَّهِ بِغَيْرِ سُلْطَانٍ أَتَاهُمْ إِنْ فِي صُدُورِهِمْ إِلَّا كِبْرٌ مَا هُمْ بِبَالِغِيهِ فَاسْتَعِذْ بِاللَّهِ إِنَّهُ هُوَ السَّمِيعُ الْبَصِيرُ"}, {"s": 40, "a": 57, "t": "لَخَلْقُ السَّمَاوَاتِ وَالْأَرْضِ أَكْبَرُ مِنْ خَلْقِ النَّاسِ وَلَكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ"}, {"s": 40, "a": 58, "t": "وَمَا يَسْتَوِي الْأَعْمَى وَالْبَصِيرُ وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَلَا الْمُسِيءُ قَلِيلًا مَا تَتَذَكَّرُونَ"}], "524": [{"s": 52, "a": 15, "t": "أَفَسِحْرٌ هَذَا أَمْ أَنْتُمْ لَا تُبْصِرُونَ"}, {"s": 52, "a": 16, "t": "اصْلَوْهَا فَاصْبِرُوا أَوْ لَا تَصْبِرُوا سَوَاءٌ عَلَيْكُمْ إِنَّمَا تُجْزَوْنَ مَا كُنْتُمْ تَعْمَلُونَ"}, {"s": 52, "a": 17, "t": "إِنَّ الْمُتَّقِينَ فِي جَنَّاتٍ وَنَعِيمٍ"}, {"s": 52, "a": 18, "t": "فَاكِهِينَ بِمَا آتَاهُمْ رَبُّهُمْ وَوَقَاهُمْ رَبُّهُمْ عَذَابَ الْجَحِيمِ"}, {"s": 52, "a": 19, "t": "كُلُوا وَاشْرَبُوا هَنِيئًا بِمَا كُنْتُمْ تَعْمَلُونَ"}, {"s": 52, "a": 20, "t": "مُتَّكِئِينَ عَلَى سُرُرٍ مَصْفُوفَةٍ وَزَوَّجْنَاهُمْ بِحُورٍ عِينٍ"}, {"s": 52, "a": 21, "t": "وَالَّذِينَ آمَنُوا وَاتَّبَعَتْهُمْ ذُرِّيَّتُهُمْ بِإِيمَانٍ أَلْحَقْنَا بِهِمْ ذُرِّيَّتَهُمْ وَمَا أَلَتْنَاهُمْ مِنْ عَمَلِهِمْ مِنْ شَيْءٍ كُلُّ امْرِئٍ بِمَا كَسَبَ رَهِينٌ"}, {"s": 52, "a": 22, "t": "وَأَمْدَدْنَاهُمْ بِفَاكِهَةٍ وَلَحْمٍ مِمَّا يَشْتَهُونَ"}, {"s": 52, "a": 23, "t": "يَتَنَازَعُونَ فِيهَا كَأْسًا لَا لَغْوٌ فِيهَا وَلَا تَأْثِيمٌ"}, {"s": 52, "a": 24, "t": "وَيَطُوفُ عَلَيْهِمْ غِلْمَانٌ لَهُمْ كَأَنَّهُمْ لُؤْلُؤٌ مَكْنُونٌ"}, {"s": 52, "a": 25, "t": "وَأَقْبَلَ بَعْضُهُمْ عَلَى بَعْضٍ يَتَسَاءَلُونَ"}, {"s": 52, "a": 26, "t": "قَالُوا إِنَّا كُنَّا قَبْلُ فِي أَهْلِنَا مُشْفِقِينَ"}, {"s": 52, "a": 27, "t": "فَمَنَّ اللَّهُ عَلَيْنَا وَوَقَانَا عَذَابَ السَّمُومِ"}, {"s": 52, "a": 28, "t": "إِنَّا كُنَّا مِنْ قَبْلُ نَدْعُوهُ إِنَّهُ هُوَ الْبَرُّ الرَّحِيمُ"}, {"s": 52, "a": 29, "t": "فَذَكِّرْ فَمَا أَنْتَ بِنِعْمَةِ رَبِّكَ بِكَاهِنٍ وَلَا مَجْنُونٍ"}, {"s": 52, "a": 30, "t": "أَمْ يَقُولُونَ شَاعِرٌ نَتَرَبَّصُ بِهِ رَيْبَ الْمَنُونِ"}, {"s": 52, "a": 31, "t": "قُلْ تَرَبَّصُوا فَإِنِّي مَعَكُمْ مِنَ الْمُتَرَبِّصِينَ"}], "486": [{"s": 42, "a": 23, "t": "ذَلِكَ الَّذِي يُبَشِّرُ اللَّهُ عِبَادَهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ قُلْ لَا أَسْأَلُكُمْ عَلَيْهِ أَجْرًا إِلَّا الْمَوَدَّةَ فِي الْقُرْبَى وَمَنْ يَقْتَرِفْ حَسَنَةً نَزِدْ لَهُ فِيهَا حُسْنًا إِنَّ اللَّهَ غَفُورٌ شَكُورٌ"}, {"s": 42, "a": 24, "t": "أَمْ يَقُولُونَ افْتَرَى عَلَى اللَّهِ كَذِبًا فَإِنْ يَشَإِ اللَّهُ يَخْتِمْ عَلَى قَلْبِكَ وَيَمْحُ اللَّهُ الْبَاطِلَ وَيُحِقُّ الْحَقَّ بِكَلِمَاتِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ"}, {"s": 42, "a": 25, "t": "وَهُوَ الَّذِي يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ وَيَعْفُو عَنِ السَّيِّئَاتِ وَيَعْلَمُ مَا تَفْعَلُونَ"}, {"s": 42, "a": 26, "t": "وَيَسْتَجِيبُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَيَزِيدُهُمْ مِنْ فَضْلِهِ وَالْكَافِرُونَ لَهُمْ عَذَابٌ شَدِيدٌ"}, {"s": 42, "a": 27, "t": "وَلَوْ بَسَطَ اللَّهُ الرِّزْقَ لِعِبَادِهِ لَبَغَوْا فِي الْأَرْضِ وَلَكِنْ يُنَزِّلُ بِقَدَرٍ مَا يَشَاءُ إِنَّهُ بِعِبَادِهِ خَبِيرٌ بَصِيرٌ"}, {"s": 42, "a": 28, "t": "وَهُوَ الَّذِي يُنَزِّلُ الْغَيْثَ مِنْ بَعْدِ مَا قَنَطُوا وَيَنْشُرُ رَحْمَتَهُ وَهُوَ الْوَلِيُّ الْحَمِيدُ"}, {"s": 42, "a": 29, "t": "وَمِنْ آيَاتِهِ خَلْقُ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَثَّ فِيهِمَا مِنْ دَابَّةٍ وَهُوَ عَلَى جَمْعِهِمْ إِذَا يَشَاءُ قَدِيرٌ"}, {"s": 42, "a": 30, "t": "وَمَا أَصَابَكُمْ مِنْ مُصِيبَةٍ فَبِمَا كَسَبَتْ أَيْدِيكُمْ وَيَعْفُو عَنْ كَثِيرٍ"}, {"s": 42, "a": 31, "t": "وَمَا أَنْتُمْ بِمُعْجِزِينَ فِي الْأَرْضِ وَمَا لَكُمْ مِنْ دُونِ اللَّهِ مِنْ وَلِيٍّ وَلَا نَصِيرٍ"}], "415": [{"s": 32, "a": 1, "t": "الم"}, {"s": 32, "a": 2, "t": "تَنْزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ مِنْ رَبِّ الْعَالَمِينَ"}, {"s": 32, "a": 3, "t": "أَمْ يَقُولُونَ افْتَرَاهُ بَلْ هُوَ الْحَقُّ مِنْ رَبِّكَ لِتُنْذِرَ قَوْمًا مَا أَتَاهُمْ مِنْ نَذِيرٍ مِنْ قَبْلِكَ لَعَلَّهُمْ يَهْتَدُونَ"}, {"s": 32, "a": 4, "t": "اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَى عَلَى الْعَرْشِ مَا لَكُمْ مِنْ دُونِهِ مِنْ وَلِيٍّ وَلَا شَفِيعٍ أَفَلَا تَتَذَكَّرُونَ"}, {"s": 32, "a": 5, "t": "يُدَبِّرُ الْأَمْرَ مِنَ السَّمَاءِ إِلَى الْأَرْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِي يَوْمٍ كَانَ مِقْدَارُهُ أَلْفَ سَنَةٍ مِمَّا تَعُدُّونَ"}, {"s": 32, "a": 6, "t": "ذَلِكَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْعَزِيزُ الرَّحِيمُ"}, {"s": 32, "a": 7, "t": "الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ وَبَدَأَ خَلْقَ الْإِنْسَانِ مِنْ طِينٍ"}, {"s": 32, "a": 8, "t": "ثُمَّ جَعَلَ نَسْلَهُ مِنْ سُلَالَةٍ مِنْ مَاءٍ مَهِينٍ"}, {"s": 32, "a": 9, "t": "ثُمَّ سَوَّاهُ وَنَفَخَ فِيهِ مِنْ رُوحِهِ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَا تَشْكُرُونَ"}, {"s": 32, "a": 10, "t": "وَقَالُوا أَإِذَا ضَلَلْنَا فِي الْأَرْضِ أَإِنَّا لَفِي خَلْقٍ جَدِيدٍ بَلْ هُمْ بِلِقَاءِ رَبِّهِمْ كَافِرُونَ"}, {"s": 32, "a": 11, "t": "قُلْ يَتَوَفَّاكُمْ مَلَكُ الْمَوْتِ الَّذِي وُكِّلَ بِكُمْ ثُمَّ إِلَى رَبِّكُمْ تُرْجَعُونَ"}], "403": [{"s": 29, "a": 53, "t": "وَيَسْتَعْجِلُونَكَ بِالْعَذَابِ وَلَوْلَا أَجَلٌ مُسَمًّى لَجَاءَهُمُ الْعَذَابُ وَلَيَأْتِيَنَّهُمْ بَغْتَةً وَهُمْ لَا يَشْعُرُونَ"}, {"s": 29, "a": 54, "t": "يَسْتَعْجِلُونَكَ بِالْعَذَابِ وَإِنَّ جَهَنَّمَ لَمُحِيطَةٌ بِالْكَافِرِينَ"}, {"s": 29, "a": 55, "t": "يَوْمَ يَغْشَاهُمُ الْعَذَابُ مِنْ فَوْقِهِمْ وَمِنْ تَحْتِ أَرْجُلِهِمْ وَيَقُولُ ذُوقُوا مَا كُنْتُمْ تَعْمَلُونَ"}, {"s": 29, "a": 56, "t": "يَاعِبَادِيَ الَّذِينَ آمَنُوا إِنَّ أَرْضِي وَاسِعَةٌ فَإِيَّايَ فَاعْبُدُونِ"}, {"s": 29, "a": 57, "t": "كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ثُمَّ إِلَيْنَا تُرْجَعُونَ"}, {"s": 29, "a": 58, "t": "وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَنُبَوِّئَنَّهُمْ مِنَ الْجَنَّةِ غُرَفًا تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا نِعْمَ أَجْرُ الْعَامِلِينَ"}, {"s": 29, "a": 59, "t": "الَّذِينَ صَبَرُوا وَعَلَى رَبِّهِمْ يَتَوَكَّلُونَ"}, {"s": 29, "a": 60, "t": "وَكَأَيِّنْ مِنْ دَابَّةٍ لَا تَحْمِلُ رِزْقَهَا اللَّهُ يَرْزُقُهَا وَإِيَّاكُمْ وَهُوَ السَّمِيعُ الْعَلِيمُ"}, {"s": 29, "a": 61, "t": "وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ فَأَنَّى يُؤْفَكُونَ"}, {"s": 29, "a": 62, "t": "اللَّهُ يَبْسُطُ الرِّزْقَ لِمَنْ يَشَاءُ مِنْ عِبَادِهِ وَيَقْدِرُ لَهُ إِنَّ const VERSES={"2-48": "وَاتَّقُوا يَوْمًا لَا تَجْزِي نَفْسٌ عَنْ نَفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا شَفَاعَةٌ وَلَا يُؤْخَذُ مِنْهَا عَدْلٌ وَلَا هُمْ يُنْصَرُونَ", "2-123": "وَاتَّقُوا يَوْمًا لَا تَجْزِي نَفْسٌ عَنْ نَفْسٍ شَيْئًا وَلَا يُقْبَلُ مِنْهَا عَدْلٌ وَلَا تَنْفَعُهَا شَفَاعَةٌ وَلَا هُمْ يُنْصَرُونَ", "39-38": "وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ قُلْ أَفَرَأَيْتُمْ مَا تَدْعُونَ مِنْ دُونِ اللَّهِ إِنْ أَرَادَنِيَ اللَّهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّهِ أَوْ أَرَادَنِي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِهِ قُلْ حَسْبِيَ اللَّهُ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ", "43-9": "وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ خَلَقَهُنَّ الْعَزِيزُ الْعَلِيمُ", "31-25": "وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ قُلِ الْحَمْدُ لِلَّهِ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ", "29-61": "وَلَئِنْ سَأَلْتَهُمْ مَنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ فَأَنَّى يُؤْفَكُونَ", "12-21": "وَقَالَ الَّذِي اشْتَرَاهُ مِنْ مِصْرَ لِامْرَأَتِهِ أَكْرِمِي مَثْوَاهُ عَسَى أَنْ يَنْفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ وَلِنُعَلِّمَهُ مِنْ تَأْوِيلِ الْأَحَادِيثِ وَاللَّهُ غَالِبٌ عَلَى أَمْرِهِ وَلَكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ", "12-56": "وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَاءُ نُصِيبُ بِرَحْمَتِنَا مَنْ نَشَاءُ وَلَا نُضِيعُ أَجْرَ الْمُحْسِنِينَ", "41-50": "وَلَئِنْ أَذَقْنَاهُ رَحْمَةً مِنَّا مِنْ بَعْدِ ضَرَّاءَ مَسَّتْهُ لَيَقُولَنَّ هَذَا لِي وَمَا أَظُنُّ السَّاعَةَ قَائِمَةً وَلَئِنْ رُجِعْتُ إِلَى رَبِّي إِنَّ لِي عِنْدَهُ لَلْحُسْنَى فَلَنُنَبِّئَنَّ الَّذِينَ كَفَرُوا بِمَا عَمِلُوا وَلَنُذِيقَنَّهُمْ مِنْ عَذَابٍ غَلِيظٍ", "11-10": "وَلَئِنْ أَذَقْنَاهُ نَعْمَاءَ بَعْدَ ضَرَّاءَ مَسَّتْهُ لَيَقُولَنَّ ذَهَبَ السَّيِّئَاتُ عَنِّي إِنَّهُ لَفَرِحٌ فَخُورٌ", "35-19": "وَمَا يَسْتَوِي الْأَعْمَى وَالْبَصِ function renderPage(pageNo, focus) {
  const vs = PAGES[pageNo];
  const surahs = [...new Set(vs.map(v => v.s))];
  let html = "";
  let cur = null;
  vs.forEach(v => {
    if (v.s !== cur) {
      cur = v.s;
      if (v.a === 1) {
        html += `<div class="sh">سُورَةُ ${SURAHS[v.s-1]}</div>`;
        if (v.s !== 9) html += `<div class="bs">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
      }
    }
    const k = `${v.s}-${v.a}`;
    html += `<span class="v${focus.includes(k) ? " hl" : ""}">${v.t}<span class="n">${AR(v.a)}</span></span> `;
  });
  return `<div class="page">
    <div class="head"><span>${surahs.map(s => SURAHS[s-1]).join(" · ")}</span><span>الجزء ${AR(juzOf(pageNo))}</span></div>
    <div class="lines"><div class="txt">${html}</div></div>
    <div class="foot">${AR(pageNo)}</div>
  </div>`;
}

function fit(page) {
  const lines = page.querySelector(".lines"), txt = page.querySelector(".txt");
  const H = lines.clientHeight; if (!H) return;
  const lh = H / 15;                         // 15 lines per page, Madinah layout
  txt.style.lineHeight = lh + "px";
  txt.querySelectorAll(".sh,.bs").forEach(e => { e.style.height = lh + "px"; e.style.lineHeight = lh + "px"; });
  let lo = 8, hi = lh * 0.9, best = lo;
  for (let i = 0; i < 18; i++) {              // binary search: largest font size that still fits 15 lines
    const mid = (lo + hi) / 2; txt.style.fontSize = mid + "px";
    if (txt.scrollHeight <= H + 1) { best = mid; lo = mid; } else hi = mid;
  }
  txt.style.fontSize = best + "px";
}

const viewer = document.getElementById("viewer");
function openQ(q, n) {
  const pageNo = typeof q.page === "number" ? q.page : pageOfKey(q.page);
  const focus = q.focus || [];
  const kind = q.type === "m" ? "متشابه" : "تلاوة";
  let ans = "";
  if (q.type === "m") {
    ans = `<div class="answer" id="ans" hidden><h3>المواضع المتشابهة</h3><ol>` + q.answers.map(a => {
      const p = PAGE_INDEX[a.key] || pageOfKey(a.key);
      const inRange = !q.minJuz || (p && juzOf(p) >= q.minJuz);
      return `<li><div class="ay">${VERSES[a.key] || ""}</div><div class="loc">${refOf(a.key)}${p ? ` · ص ${AR(p)} · الجزء ${AR(juzOf(p))}` : ""}${inRange ? "" : ` <span class="out">(خارج مقرر الطالب، للاستئناس)</span>`}</div>${a.note ? `<div class="note">${a.note}</div>` : ""}</li>`;
    }).join("") + `</ol></div>`;
  }
  viewer.innerHTML = `
    <div class="bar"><div class="who">${q.student}<small>السؤال ${AR(n)} · ${kind}</small></div><button class="btn" id="close">إغلاق</button></div>
    <div class="prompt ${q.type}"><span class="kind">${kind}</span><p>${q.prompt}</p><div class="ref">${focus.length ? focus.map(refOf).join(" ، ") + " · " : ""}صفحة ${AR(pageNo)}</div></div>

    ${ans}
    <div class="actions">
      ${q.type === "m" ? `<button class="btn" id="toggleAns">إظهار المواضع</button>` : ""}
      <button class="btn primary" id="markDone">${done[q.id] ? "إلغاء علامة الإنجاز" : "تمّ السؤال ✓"}</button>
    </div>`;

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
  requestAnimationFrame(refit);
  window.addEventListener("resize", refit, { once: true });
  viewer.querySelector("#close").addEventListener("click", () => { viewer.hidden = true; rerender(); });
  const t = viewer.querySelector("#toggleAns");
  if (t) t.addEventListener("click", () => { const a = viewer.querySelector("#ans"); a.hidden = !a.hidden; t.textContent = a.hidden ? "إظهار المواضع" : "إخفاء المواضع"; if (!a.hidden) a.scrollIntoView({ behavior: "smooth", block: "start" }); });
  viewer.querySelector("#markDone").addEventListener("click", () => { if (done[q.id]) delete done[q.id]; else done[q.id] = 1; saveDone(); viewer.hidden = true; rerender(); });
}
